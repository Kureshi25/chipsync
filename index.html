const usePersist = (key, init) => {
  const [val, setVal] = React.useState(() => {
    try {const s = localStorage.getItem("cs_" + key);return s ? JSON.parse(s) : init;} catch {return init;}
  });
  const set = React.useCallback((v) => {
    setVal((prev) => {
      const next = typeof v === "function" ? v(prev) : v;
      try {localStorage.setItem("cs_" + key, JSON.stringify(next));} catch {}
      return next;
    });
  }, [key]);
  return [val, set];
};

const QuotationBuilder = ({ lead, onClose, onSaveQuote, accent }) => {

  const parseItems = () => {
    if (!lead.products) return [{ desc: "", qty: 1, unitPrice: "", total: 0 }];
    return lead.products.split(",").map((p) => {
      const m = p.trim().match(/^(.+?)\s+x(\d+)$/i);
      return m ? { desc: m[1].trim(), qty: parseInt(m[2]), unitPrice: "", total: 0 } : { desc: p.trim(), qty: 1, unitPrice: "", total: 0 };

  const [items, setItems] = React.useState(parseItems);
  const [vatPct, setVatPct] = React.useState(5);
  const [notes, setNotes] = React.useState("Thank you for your inquiry. We look forward to doing business with you.");
  const [payTerms, setPayTerms] = React.useState("50% advance, 50% on delivery");
  const [delivery, setDelivery] = React.useState("2–4 business days (UAE)");
  const [validity, setValidity] = React.useState("7 days");

  const updateItem = (i, field, val) => {

// ─── LEADS PAGE ───────────────────────────────────────────────────────────────
const LeadsPage = ({ leads, onUpdate, onAdd, onDelete, activities, onAddActivity, currentUser, accent }) => {

          <p style={{ fontSize: 12, color: "#6b7280", marginTop: 2 }}>{leads.length} total · {filtered.length} shown{overdueCount > 0 ? <span style={{ color: "#ef4444", marginLeft: 8 }}>· ⚠ {overdueCount} overdue follow-ups</span> : ""}</p>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={() => setView((v) => v === "table" ? "kanban" : "table")} style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 13px", border: "1px solid #e5e7eb", borderRadius: 8, background: "#fff", cursor: "pointer", fontSize: 12, fontWeight: 600, color: "#374151" }}>

      <div style={{ padding: "10px 26px 0", display: "flex", gap: 5, flexWrap: "wrap" }}>

            {s}{s !== "All" && statusCounts[s] > 0 ? <span style={{ marginLeft: 4, background: filterStatus === s ? accent : "#e5e7eb", color: filterStatus === s ? "#fff" : "#374151", borderRadius: 10, padding: "0 5px", fontSize: 10 }}>{statusCounts[s]}</span> : ""}

          <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search leads, companies, IDs…" style={{ width: "100%", padding: "8px 10px 8px 32px", border: "1px solid #e5e7eb", borderRadius: 8, fontSize: 12, outline: "none", background: "#fff" }} />
        </div>
        <select value={filterPriority} onChange={(e) => setFilterPriority(e.target.value)} style={{ padding: "8px 10px", border: "1px solid #e5e7eb", borderRadius: 8, fontSize: 12, background: "#fff", cursor: "pointer" }}>
          <option value="All">All Priority</option>{PRIORITIES.map((p) => <option key={p}>{p}</option>)}
        </select>
        <select value={filterAssignee} onChange={(e) => setFilterAssignee(e.target.value)} style={{ padding: "8px 10px", border: "1px solid #e5e7eb", borderRadius: 8, fontSize: 12, background: "#fff", cursor: "pointer" }}>

      </div>

            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ background: "#f9fafb", borderBottom: "1px solid #e5e7eb" }}>

                <th key={h} style={{ padding: "9px 14px", textAlign: "left", fontSize: 10, fontWeight: 700, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.05em", whiteSpace: "nowrap" }}>{h}</th>

                      <td style={{ padding: "10px 14px", fontSize: 11, fontWeight: 700, color: accent, fontFamily: "'DM Mono',monospace" }}>{lead.id}</td>

                      <td style={{ padding: "10px 14px" }}><PriBadge p={lead.priority} /></td>
                      <td style={{ padding: "10px 14px" }}>

                        <div style={{ fontWeight: 700, fontSize: 12, color: "#111827", marginBottom: 2 }}>{l.name}</div>
                        <div style={{ fontSize: 11, color: "#6b7280", marginBottom: 8 }}>{l.company}</div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>

                          <PriBadge p={l.priority} />
                        </div>
                        {l.assignee !== "Unassigned" && <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 8, paddingTop: 8, borderTop: "1px solid #f3f4f6" }}><Avatar name={l.assignee} size={18} /><span style={{ fontSize: 10, color: "#9ca3af" }}>{l.assignee}</span></div>}
                      </div>

                    {col.length === 0 && <div style={{ fontSize: 11, color: "#d1d5db", textAlign: "center", padding: "16px 0" }}>Empty</div>}
                  </div>
                </div>);

          })}
          </div>

      {selected && <LeadDrawer lead={leads.find((l) => l.id === selected.id) || selected} onClose={() => setSelected(null)} onUpdate={(l) => {onUpdate(l);setSelected(l);}} activities={activities} onAddActivity={onAddActivity} onDelete={(id) => {onDelete(id);setSelected(null);}} currentUser={currentUser} accent={accent} />}
      {showAdd && <LeadModal onSave={(l) => {onAdd(l);setShowAdd(false);}} onClose={() => setShowAdd(false)} accent={accent} />}
    </div>);

};

// ─── CUSTOMERS PAGE ───────────────────────────────────────────────────────────

// ─── NOTIFICATIONS ────────────────────────────────────────────────────────────
const NotificationsPanel = ({ leads, onClose, accent, T = LIGHT }) => {
  const overdue = leads.filter((l) => l.followUp && l.followUp < today() && !["Closed", "Lost", "Ordered"].includes(l.status));
  const newLeads = leads.filter((l) => l.status === "New");
  const unassigned = leads.filter((l) => l.assignee === "Unassigned");
  const notifs = [
  ...overdue.map((l) => ({ type: "warning", msg: `Follow-up overdue: ${l.name} (${l.company})`, sub: l.followUp, color: "#ef4444" })),
  ...newLeads.map((l) => ({ type: "new", msg: `New inquiry from ${l.name}`, sub: l.company, color: "#3b82f6" })),
  ...unassigned.map((l) => ({ type: "assign", msg: `Unassigned lead: ${l.id}`, sub: l.company, color: "#f97316" }))];


  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 500 }} onClick={onClose}>
      <div style={{ position: "absolute", top: 52, right: 16, width: 320, background: T.surface, borderRadius: 12, border: `1px solid ${T.border}`, boxShadow: "0 8px 32px rgba(0,0,0,0.15)", overflow: "hidden", animation: "slideUp 0.15s ease" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: "12px 16px", borderBottom: `1px solid ${T.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontWeight: 700, fontSize: 13, color: T.text }}>Notifications</span>
          <span style={{ fontSize: 11, padding: "2px 7px", background: accent + "18", color: accent, borderRadius: 10, fontWeight: 700 }}>{notifs.length}</span>
        </div>
        <div style={{ maxHeight: 360, overflowY: "auto" }}>
          {notifs.length === 0 && <div style={{ padding: 24, textAlign: "center", color: "#9ca3af", fontSize: 12 }}>All caught up! 🎉</div>}
          {notifs.map((n, i) =>
          <div key={i} style={{ padding: "10px 16px", borderBottom: "1px solid #f3f4f6", display: "flex", gap: 10, alignItems: "flex-start" }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: n.color, marginTop: 4, flexShrink: 0 }}></div>
              <div><div style={{ fontSize: 12, fontWeight: 600, color: "#111827" }}>{n.msg}</div><div style={{ fontSize: 10, color: "#9ca3af", marginTop: 1 }}>{n.sub}</div></div>

const GlobalSearch = ({ leads, customers, onSelectLead, onClose, accent, T = LIGHT }) => {

  return (

          <input ref={ref} value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search leads, customers, IDs…" style={{ flex: 1, border: "none", outline: "none", fontSize: 15, color: T.text, background: "none" }} />
          <button onClick={onClose} style={{ background: "none", border: `1px solid ${T.border}`, cursor: "pointer", fontSize: 11, color: T.textMuted, padding: "2px 6px", borderRadius: 4 }}>Esc</button>
        </div>
        {results.length > 0 &&
        <div style={{ maxHeight: 360, overflowY: "auto" }}>

                  <div style={{ fontSize: 11, color: T.textMuted }}>{r.type === "lead" ? `${r.item.company} · ${r.item.id} · ${r.item.status}` : r.item.contact}</div>
                </div>
                <IC n="chevronRight" s={14} c={T.textMuted} />

        }
        {q.length > 1 && results.length === 0 && <div style={{ padding: 24, textAlign: "center", color: T.textMuted, fontSize: 13 }}>No results for "{q}"</div>}
        {q.length === 0 && <div style={{ padding: "12px 16px", fontSize: 11, color: T.textMuted }}>Type to search leads, customers, and more…</div>}

// ─── ANALYTICS PAGE ───────────────────────────────────────────────────────────
const AnalyticsPage = ({ leads, accent, T = LIGHT }) => {

  const pipeline = leads.filter((l) => !["Lost", "Closed"].includes(l.status)).reduce((s, l) => s + (parseInt(l.budget) || 0), 0);
  const won = leads.filter((l) => ["Ordered", "Closed"].includes(l.status)).reduce((s, l) => s + (parseInt(l.budget) || 0), 0);

  const catData = CATEGORIES.map((c) => ({ name: c, count: leads.filter((l) => l.category === c).length })).filter((c) => c.count > 0).sort((a, b) => b.count - a.count);

  const maxCat = Math.max(...catData.map((c) => c.count), 1);

  const funnelStages = Object.keys(STATUS_CFG).map((s) => ({ label: s, count: leads.filter((l) => l.status === s).length, color: STATUS_CFG[s].bg, dot: STATUS_CFG[s].dot }));

    value: leads.filter((l) => l.assignee === name).reduce((s, l) => s + (parseInt(l.budget) || 0), 0)

        <MetricCard label="Conversion Rate" value={rate + "%"} sub="Inquiry → Order" icon="trending" accent="#22c55e" T={T} />
        <MetricCard label="Pipeline Value" value={"AED " + fmtShort(pipeline)} sub="Active leads" icon="dollar" accent="#7c3aed" T={T} />
        <MetricCard label="Won Value" value={"AED " + fmtShort(won)} sub="Ordered + Closed" icon="check" accent="#059669" T={T} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>
        {/* Funnel */}
        <div style={{ background: T.surface, borderRadius: 12, border: `1px solid ${T.border}`, padding: 18 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: T.text, marginBottom: 14 }}>Lead Pipeline Status</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
            {funnelStages.map((f) =>
            <div key={f.label} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 90, fontSize: 11, color: "#6b7280" }}>{f.label}</div>
                <div style={{ flex: 1, background: "#f3f4f6", borderRadius: 4, height: 16, overflow: "hidden" }}>
                  <div style={{ width: `${f.count / maxFunnel * 100}%`, height: "100%", background: f.dot, borderRadius: 4, transition: "width 0.5s", opacity: 0.7 }}></div>
                </div>
                <div style={{ width: 24, textAlign: "right", fontSize: 12, fontWeight: 700, color: "#111827" }}>{f.count}</div>
              </div>
            )}
          </div>
        </div>
        {/* Category */}
        <div style={{ background: T.surface, borderRadius: 12, border: `1px solid ${T.border}`, padding: 18 }}>
          <div style={{ fontWeight: 700, fontSize: 13, color: T.text, marginBottom: 14 }}>Top Categories</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>

                <div style={{ width: 90, fontSize: 11, color: "#374151", fontWeight: 500 }}>{c.name}</div>

                </div>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#374151", width: 16 }}>{c.count}</div>
              </div>
            )}
          </div>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        {/* Lead sources */}
        <div style={{ background: T.surface, borderRadius: 12, border: `1px solid ${T.border}`, padding: 18 }}>

                <span style={{ fontSize: 11, fontWeight: 700, color: "#374151", width: 24, textAlign: "right" }}>{s.count}</span>

      <div style={{ flex: 1, overflow: "auto", padding: "0 26px 24px" }}>
        <div style={{ display: "flex", gap: 12, height: "100%" }}>
          {Object.keys(STATUS_CFG).map((st) => {
            const col = leads.filter((l) => l.status === st);
            const cfg = STATUS_CFG[st];
            const val = col.reduce((s, l) => s + (parseInt(l.budget) || 0), 0);
            return (
              <div key={st} style={{ width: 220, flexShrink: 0, display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ padding: "8px 12px", background: cfg.bg, borderRadius: 8, border: `1px solid ${cfg.dot}33` }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: cfg.text }}>{st}</span>
                    <span style={{ fontSize: 10, fontWeight: 700, background: "rgba(255,255,255,0.7)", color: cfg.text, borderRadius: 10, padding: "1px 7px" }}>{col.length}</span>
                  </div>
                  <div style={{ fontSize: 10, color: cfg.text, opacity: 0.7, marginTop: 2 }}>AED {val.toLocaleString()}</div>
                </div>
                <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 7 }}>
                  {col.map((l) =>
                  <div key={l.id} onClick={() => onSelectLead(l)} style={{ background: "#fff", borderRadius: 9, padding: "11px 13px", border: "1px solid #e5e7eb", cursor: "pointer", boxShadow: "0 1px 3px rgba(0,0,0,0.04)", transition: "box-shadow 0.15s,transform 0.15s" }} onMouseEnter={(e) => {e.currentTarget.style.boxShadow = "0 4px 12px rgba(0,0,0,0.1)";e.currentTarget.style.transform = "translateY(-1px)";}} onMouseLeave={(e) => {e.currentTarget.style.boxShadow = "0 1px 3px rgba(0,0,0,0.04)";e.currentTarget.style.transform = "none";}}>
                      <div style={{ fontWeight: 700, fontSize: 11, color: "#111827", marginBottom: 1 }}>{l.name}</div>
                      <div style={{ fontSize: 10, color: "#6b7280", marginBottom: 6 }}>{l.company}</div>
                      <div style={{ fontSize: 11, fontWeight: 800, color: accent, marginBottom: 4 }}>AED {parseInt(l.budget || 0).toLocaleString()}</div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <PriBadge p={l.priority} />
                        {l.assignee !== "Unassigned" ? <div style={{ display: "flex", alignItems: "center", gap: 4 }}><Avatar name={l.assignee} size={16} /><span style={{ fontSize: 9, color: "#9ca3af" }}>{l.assignee}</span></div> : <span style={{ fontSize: 9, color: "#d1d5db" }}>Unassigned</span>}
                      </div>
                      {l.followUp && l.followUp < today() && <div style={{ marginTop: 6, fontSize: 9, color: "#ef4444", fontWeight: 700 }}>⚠ Follow-up overdue</div>}
                    </div>
                  )}
                  {col.length === 0 && <div style={{ fontSize: 11, color: "#d1d5db", textAlign: "center", padding: "20px 0", border: "1px dashed #e5e7eb", borderRadius: 8 }}>Empty</div>}
                </div>
              </div>);

          })}
        </div>
      </div>
    </div>);

};

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const accent = tweaks.accentColor;
  const darkMode = tweaks.darkMode;
  const T = useTheme(darkMode);

  // Apply dark class to body
  React.useEffect(() => {
    document.body.classList.toggle("dark", darkMode);
  }, [darkMode]);

  const [currentUser, setCurrentUser] = React.useState(() => {try {return JSON.parse(sessionStorage.getItem("chipsync_user")) || null;} catch {return null;}});
  const [page, setPage] = React.useState("dashboard");
  const [leads, setLeads] = usePersist("leads", INIT_LEADS);
  const [customers, setCustomers] = usePersist("customers", INIT_CUSTOMERS);
  const [activities, setActivities] = usePersist("activities", INIT_ACTIVITIES);
  const [pipelineSelected, setPipelineSelected] = React.useState(null);
  const [showNotifs, setShowNotifs] = React.useState(false);
  const [showSearch, setShowSearch] = React.useState(false);
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);
  const [mobileSidebarOpen, setMobileSidebarOpen] = React.useState(false);
  const isMobile = typeof window !== "undefined" && window.innerWidth <= 768;

  React.useEffect(() => {
    const handler = (e) => {if ((e.metaKey || e.ctrlKey) && e.key === "k") {e.preventDefault();setShowSearch(true);}};
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  const handleLogin = (acc) => {sessionStorage.setItem("chipsync_user", JSON.stringify(acc));setCurrentUser(acc);};
  const handleLogout = () => {sessionStorage.removeItem("chipsync_user");setCurrentUser(null);};

  const addLead = (l) => setLeads((p) => [l, ...p]);
  const updateLead = (l) => setLeads((p) => p.map((x) => x.id === l.id ? l : x));
  const deleteLead = (id) => setLeads((p) => p.filter((x) => x.id !== id));
  const addActivity = (lid, a) => setActivities((p) => ({ ...p, [lid]: [...(p[lid] || []), a] }));
  const addCustomer = (c) => setCustomers((p) => [c, ...p]);
  const updateCustomer = (c) => setCustomers((p) => p.map((x) => x.id === c.id ? c : x));

  const newLeadsCount = leads.filter((l) => l.status === "New").length;
  const overdueCount = leads.filter((l) => l.followUp && l.followUp < today() && !["Closed", "Lost", "Ordered"].includes(l.status)).length;
  const notifCount = newLeadsCount + overdueCount + leads.filter((l) => l.assignee === "Unassigned").length;

  if (!currentUser) return <LoginScreen onLogin={handleLogin} />;

  const NAV = [
  { id: "dashboard", label: "Overview", icon: "dashboard" },
  { id: "leads", label: "Leads", icon: "leads", badge: newLeadsCount },
  { id: "pipeline", label: "Pipeline", icon: "pipeline" },
  { id: "customers", label: "Customers", icon: "customers" },
  { id: "analytics", label: "Analytics", icon: "analytics" },
  { id: "team", label: "Team", icon: "team" },
  { id: "settings", label: "Settings", icon: "settings" }];


  const sidebarBg = tweaks.sidebarDark ? "#111827" : T.surface;
  const sidebarText = tweaks.sidebarDark ? "#d1d5db" : T.textSub;
  const sidebarBorder = tweaks.sidebarDark ? "#1f2937" : T.border;
  const SW = sidebarCollapsed ? 56 : 210;

  const renderPage = () => {
    const props = { accent, currentUser, T };
    if (page === "dashboard") return <DashboardHome leads={leads} customers={customers} activities={activities} setPage={setPage} {...props} />;
    if (page === "leads") return <LeadsPage leads={leads} onUpdate={updateLead} onAdd={addLead} onDelete={deleteLead} activities={activities} onAddActivity={addActivity} {...props} />;
    if (page === "pipeline") return <PipelinePage leads={leads} onUpdate={updateLead} onSelectLead={(l) => {setPipelineSelected(l);setPage("leads");}} {...props} />;
    if (page === "customers") return <CustomersPage customers={customers} onAdd={addCustomer} onUpdate={updateCustomer} onDelete={(id) => setCustomers((p) => p.filter((x) => x.id !== id))} {...props} />;
    if (page === "analytics") return <AnalyticsPage leads={leads} {...props} />;
    if (page === "team") return (
      <div style={{ padding: "20px 26px", overflowY: "auto", height: "100%" }}>
        <h1 style={{ fontSize: 20, fontWeight: 800, color: "#111827", marginBottom: 20 }}>Team</h1>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(240px,1fr))", gap: 14 }}>
          {TEAM_ACCOUNTS.map((t) => {
            const tLeads = leads.filter((l) => l.assignee === t.name);
            const tWon = tLeads.filter((l) => ["Ordered", "Closed"].includes(l.status));
            return (
              <div key={t.username} style={{ background: "#fff", borderRadius: 12, border: "1px solid #e5e7eb", padding: 22, textAlign: "center" }}>
                <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}><Avatar name={t.name} size={52} /></div>
                <div style={{ fontWeight: 800, fontSize: 15, color: "#111827" }}>{t.name}</div>
                <div style={{ fontSize: 11, color: "#9ca3af", marginBottom: 4 }}>{t.email}</div>
                <span style={{ fontSize: 10, padding: "2px 8px", background: accent + "18", color: accent, borderRadius: 10, fontWeight: 700 }}>{t.roleLabel.split("·")[0].trim()}</span>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
                  {[["Leads", tLeads.length], ["Won", tWon.length], ["Value", "AED " + fmtShort(tLeads.reduce((s, l) => s + (parseInt(l.budget) || 0), 0))], ["Rate", tLeads.length ? Math.round(tWon.length / tLeads.length * 100) + "%" : "—"]].map(([k, v]) =>
                  <div key={k} style={{ background: "#f9fafb", borderRadius: 8, padding: "9px 6px" }}><div style={{ fontSize: 13, fontWeight: 800, color: "#111827" }}>{v}</div><div style={{ fontSize: 9, color: "#9ca3af", textTransform: "uppercase" }}>{k}</div></div>
                  )}
                </div>
              </div>);

          })}
        </div>
      </div>);

    if (page === "settings") return <SettingsPage {...props} />;
    return null;
  };

  return (
    <div style={{ display: "flex", height: "100vh", background: T.bg, overflow: "hidden", color: T.text }}>
      {/* Mobile sidebar overlay */}
      {mobileSidebarOpen && <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 150 }} onClick={() => setMobileSidebarOpen(false)} />}

      {/* Sidebar */}
      <div style={{ width: SW, background: sidebarBg, borderRight: `1px solid ${sidebarBorder}`, display: "flex", flexDirection: "column", transition: "width 0.2s, transform 0.2s", flexShrink: 0, overflow: "hidden", position: "relative", zIndex: 160,
        ...(isMobile ? { position: "fixed", top: 0, left: 0, height: "100%", transform: mobileSidebarOpen ? "translateX(0)" : "translateX(-100%)", width: 210 } : {}) }}>
        <div style={{ padding: sidebarCollapsed ? "16px 0" : "14px 14px", display: "flex", alignItems: "center", gap: 9, borderBottom: `1px solid ${sidebarBorder}`, justifyContent: sidebarCollapsed ? "center" : "flex-start", flexShrink: 0 }}>
          {sidebarCollapsed
            ? <div style={{ width:30, height:30, borderRadius:7, background:accent, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="white"/><path d="M2 17l10 5 10-5" stroke="white" strokeWidth="2.2" strokeLinecap="round"/><path d="M2 12l10 5 10-5" stroke="white" strokeWidth="2.2" strokeLinecap="round"/></svg>
              </div>
            : <img src="logo.png" alt="ChipSync" style={{ height:26, objectFit:"contain", filter: tweaks.sidebarDark ? "invert(1) brightness(2)" : "none", maxWidth:140 }} />
          }
        </div>
        <nav style={{ flex: 1, padding: "10px 6px", display: "flex", flexDirection: "column", gap: 1, overflowY: "auto" }}>
          {NAV.map((n) => {
            const active = page === n.id;
            return (
              <button key={n.id} onClick={() => {setPage(n.id);setMobileSidebarOpen(false);}} title={sidebarCollapsed ? n.label : undefined} style={{ display: "flex", alignItems: "center", gap: 9, padding: sidebarCollapsed ? "9px 0" : "8px 10px", borderRadius: 8, border: "none", background: active ? tweaks.sidebarDark ? accent + "22" : accent + "14" : "none", color: active ? accent : sidebarText, cursor: "pointer", fontSize: 12, fontWeight: active ? 700 : 500, width: "100%", justifyContent: sidebarCollapsed ? "center" : "flex-start", transition: "all 0.12s", position: "relative" }} onMouseEnter={(e) => {if (!active) e.currentTarget.style.background = tweaks.sidebarDark ? "#1f2937" : T.surface2;}} onMouseLeave={(e) => {if (!active) e.currentTarget.style.background = "none";}}>
                <IC n={n.icon} s={15} c={active ? accent : sidebarText} />
                {!sidebarCollapsed && n.label}
                {!sidebarCollapsed && n.badge > 0 && <span style={{ marginLeft: "auto", background: "#ef4444", color: "#fff", borderRadius: 10, padding: "1px 6px", fontSize: 9, fontWeight: 700 }}>{n.badge}</span>}
              </button>);

          })}
        </nav>
        <div style={{ padding: "8px 6px", borderTop: `1px solid ${sidebarBorder}` }}>
          {!isMobile && <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} style={{ display: "flex", alignItems: "center", gap: 9, padding: sidebarCollapsed ? "9px 0" : "8px 10px", borderRadius: 8, border: "none", background: "none", color: sidebarText, cursor: "pointer", fontSize: 11, width: "100%", justifyContent: sidebarCollapsed ? "center" : "flex-start" }}>
            <IC n={sidebarCollapsed ? "chevronRight" : "chevronLeft"} s={14} c={sidebarText} />
            {!sidebarCollapsed && "Collapse"}
          </button>}
        </div>
      </div>

      {/* Main */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>
        {/* Top bar */}
        <div style={{ height: 50, background: T.surface, borderBottom: `1px solid ${T.border}`, display: "flex", alignItems: "center", padding: "0 16px", gap: 8, flexShrink: 0 }}>
          {/* Mobile hamburger */}
          <button onClick={() => setMobileSidebarOpen(true)} style={{ display: isMobile ? "flex" : "none", width: 34, height: 34, borderRadius: 8, border: `1px solid ${T.border}`, background: T.surface, cursor: "pointer", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.textSub} strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></svg>
          </button>
          <button onClick={() => setShowSearch(true)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 12px", border: `1px solid ${T.border}`, borderRadius: 7, background: T.surface2, cursor: "pointer", fontSize: 12, color: T.textMuted }}>
            <IC n="search" s={13} c={T.textMuted} /> <span className="mob-hide">Search…</span> <span className="mob-hide" style={{ fontSize: 10, background: T.border, borderRadius: 4, padding: "1px 5px" }}>⌘K</span>
          </button>
          {/* CSV export button */}
          <button onClick={() => exportCSV(leads)} className="mob-hide" style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 12px", border: `1px solid ${T.border}`, borderRadius: 7, background: T.surface2, cursor: "pointer", fontSize: 11, color: T.textSub, fontWeight: 600 }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
            Export CSV
          </button>
          <div style={{ flex: 1 }} />
          <button onClick={() => setShowNotifs(!showNotifs)} style={{ position: "relative", width: 34, height: 34, borderRadius: 8, border: `1px solid ${T.border}`, background: T.surface, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <IC n="bell" s={15} c={T.textSub} />
            {notifCount > 0 && <span style={{ position: "absolute", top: 5, right: 5, width: 8, height: 8, borderRadius: "50%", background: "#ef4444", border: "1.5px solid " + T.surface }}></span>}
          </button>
          <div style={{ display: "flex", gap: 7, alignItems: "center", padding: "4px 8px", border: `1px solid ${T.border}`, borderRadius: 8 }}>
            <Avatar name={currentUser.name} size={24} />
            <div className="mob-hide" style={{ display: "flex", flexDirection: "column" }}>
              <span style={{ fontSize: 11, fontWeight: 700, color: T.text, lineHeight: 1.2 }}>{currentUser.name}</span>
              <span style={{ fontSize: 9, color: T.textMuted, lineHeight: 1.2 }}>{currentUser.roleLabel.split("·")[0].trim()}</span>
            </div>
          </div>
          <button onClick={handleLogout} title="Sign out" style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${T.border}`, background: T.surface, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <IC n="logout" s={14} c={T.textSub} />
          </button>
        </div>
        <div style={{ flex: 1, overflow: "hidden", background: T.bg }} className="fade-in" key={page}>{renderPage()}</div>
      </div>

      {showNotifs && <NotificationsPanel leads={leads} onClose={() => setShowNotifs(false)} accent={accent} T={T} />}
      {showSearch && <GlobalSearch leads={leads} customers={customers} onSelectLead={(l) => {setPage("leads");setShowSearch(false);}} onClose={() => setShowSearch(false)} accent={accent} T={T} />}

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={(v) => setTweak("accentColor", v)} />
        <TweakToggle label="Dark Mode" value={tweaks.darkMode} onChange={(v) => setTweak("darkMode", v)} />
        <TweakToggle label="Dark Sidebar" value={tweaks.sidebarDark} onChange={(v) => setTweak("sidebarDark", v)} />
        <TweakToggle label="Compact Mode" value={tweaks.compactMode} onChange={(v) => setTweak("compactMode", v)} />
      </TweaksPanel>
    </div>);

};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
