// ─── LOGIN SCREEN ─────────────────────────────────────────────────────────────
const LoginScreen = ({ onLogin }) => {
  const [username, setUsername] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [showPw, setShowPw] = React.useState(false);
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    setError("");
    setLoading(true);
    setTimeout(() => {
      const account = TEAM_ACCOUNTS.find(
        a => a.username === username.trim().toLowerCase() && a.password === password
      );
      if (account) {
        onLogin(account);
      } else {
        setError("Invalid username or password. Please try again.");
        setLoading(false);
      }
    }, 600);
  };

  return (
    <div style={{ minHeight: "100vh", background: "#111827", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
      {/* Background pattern */}
      <div style={{ position: "fixed", inset: 0, backgroundImage: "radial-gradient(circle at 20% 50%, rgba(245,158,11,0.06) 0%, transparent 60%), radial-gradient(circle at 80% 20%, rgba(124,58,237,0.05) 0%, transparent 50%)", pointerEvents: "none" }} />

      <div style={{ width: "100%", maxWidth: 400, position: "relative", zIndex: 1 }}>

                <path d="M2 17l10 5 10-5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                <path d="M2 12l10 5 10-5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
              </svg>
            </div>
            <span style={{ fontSize: 26, fontWeight: 800, color: "#fff", letterSpacing: "-0.5px" }}>ChipSync</span>
          </div>
          <p style={{ fontSize: 13, color: "#6b7280", marginTop: 4 }}>Lead Management Dashboard</p>
        </div>

        {/* Card */}
        <div style={{ background: "#1f2937", borderRadius: 16, border: "1px solid #374151", padding: "32px 32px 28px", boxShadow: "0 24px 48px rgba(0,0,0,0.4)" }}>
          <h2 style={{ fontSize: 18, fontWeight: 700, color: "#f9fafb", marginBottom: 6 }}>Sign in to your account</h2>
          <p style={{ fontSize: 13, color: "#6b7280", marginBottom: 24 }}>Team members only</p>

          <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {/* Username */}
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: "#d1d5db" }}>Username</label>
              <input
                type="text"
                value={username}
                onChange={e => setUsername(e.target.value)}
                placeholder="e.g. mubashir"
                autoComplete="username"
                required
                style={{ padding: "11px 14px", background: "#111827", border: `1px solid ${error ? "#ef4444" : "#374151"}`, borderRadius: 8, fontSize: 14, color: "#f9fafb", outline: "none", transition: "border-color 0.15s" }}
                onFocus={e => e.target.style.borderColor = "#f59e0b"}
                onBlur={e => e.target.style.borderColor = error ? "#ef4444" : "#374151"}
              />
            </div>

            {/* Password */}
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <label style={{ fontSize: 12, fontWeight: 600, color: "#d1d5db" }}>Password</label>

                  autoComplete="current-password"
                  required
                  style={{ width: "100%", padding: "11px 42px 11px 14px", background: "#111827", border: `1px solid ${error ? "#ef4444" : "#374151"}`, borderRadius: 8, fontSize: 14, color: "#f9fafb", outline: "none", transition: "border-color 0.15s" }}
                  onFocus={e => e.target.style.borderColor = "#f59e0b"}
                  onBlur={e => e.target.style.borderColor = error ? "#ef4444" : "#374151"}
                />
                <button type="button" onClick={() => setShowPw(!showPw)} style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", cursor: "pointer", color: "#6b7280", padding: 2 }}>

                    ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>

                </button>
              </div>
            </div>

            {/* Error */}
            {error && (
              <div style={{ display: "flex", gap: 8, alignItems: "center", padding: "10px 12px", background: "#fee2e2", borderRadius: 8, border: "1px solid #fecaca" }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.5" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span style={{ fontSize: 12, color: "#dc2626", fontWeight: 500 }}>{error}</span>
              </div>
            )}

            {/* Submit */}
            <button type="submit" disabled={loading} style={{ padding: "12px", background: loading ? "#d97706" : "#f59e0b", border: "none", borderRadius: 8, color: "#111827", fontSize: 14, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer", transition: "background 0.15s", marginTop: 4, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {loading ? (
                <>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111827" strokeWidth="2.5" strokeLinecap="round" style={{ animation: "spin 0.8s linear infinite" }}><path d="M21 12a9 9 0 11-6.219-8.56"/></svg>
                  Signing in…
                </>
              ) : "Sign In"}
            </button>
          </form>

          {/* Demo hint */}
          <div style={{ marginTop: 20, padding: "12px 14px", background: "#111827", borderRadius: 8, border: "1px solid #374151" }}>
            <p style={{ fontSize: 11, fontWeight: 600, color: "#6b7280", marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>Demo Accounts</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {TEAM_ACCOUNTS.map(a => (
                <button key={a.username} onClick={() => { setUsername(a.username); setPassword(a.password); setError(""); }}

                  onMouseEnter={e => e.currentTarget.style.borderColor = "#f59e0b"}
                  onMouseLeave={e => e.currentTarget.style.borderColor = "#374151"}>
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <div style={{ width: 22, height: 22, borderRadius: "50%", background: avatarColor(a.name), display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 9, fontWeight: 700 }}>{initials(a.name)}</div>
                    <span style={{ fontSize: 12, color: "#d1d5db", fontWeight: 500 }}>{a.name}</span>
                  </div>
                  <span style={{ fontSize: 10, color: "#6b7280" }}>{a.roleLabel}</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        <p style={{ textAlign: "center", marginTop: 20, fontSize: 12, color: "#4b5563" }}>
          sales@chipsync.ae · Dubai, UAE
        </p>
      </div>
      <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
    </div>
  );
};

  };

};

// ─── STATUS BADGE ─────────────────────────────────────────────────────────────
const STATUS_CONFIG = {
  "New":        { bg: "#dbeafe", text: "#1d4ed8", dot: "#3b82f6" },
  "Quoted":     { bg: "#fef9c3", text: "#854d0e", dot: "#eab308" },
  "In Progress":{ bg: "#fff7ed", text: "#9a3412", dot: "#f97316" },
  "Ordered":    { bg: "#dcfce7", text: "#15803d", dot: "#22c55e" },
  "Closed":     { bg: "#f0fdf4", text: "#166534", dot: "#16a34a" },
  "Lost":       { bg: "#fee2e2", text: "#991b1b", dot: "#ef4444" },
};

const PRIORITY_CONFIG = {
  "High":   { bg: "#fee2e2", text: "#991b1b" },
  "Medium": { bg: "#fff7ed", text: "#9a3412" },
  "Low":    { bg: "#f0fdf4", text: "#166534" },
};

const StatusBadge = ({ status }) => {
  const c = STATUS_CONFIG[status] || { bg: "#f3f4f6", text: "#374151", dot: "#6b7280" };
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 9px", borderRadius: 20, background: c.bg, color: c.text, fontSize: 12, fontWeight: 600 }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: c.dot, flexShrink: 0 }}></span>
      {status}
    </span>
  );
};

const PriorityBadge = ({ priority }) => {
  const c = PRIORITY_CONFIG[priority] || { bg: "#f3f4f6", text: "#374151" };
  return (
    <span style={{ padding: "2px 8px", borderRadius: 4, background: c.bg, color: c.text, fontSize: 11, fontWeight: 600 }}>
      {priority}
    </span>
  );
};

// ─── AVATAR ───────────────────────────────────────────────────────────────────
const initials = (name) => name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2);
const avatarColor = (name) => {
  const cols = ["#7c3aed","#2563eb","#059669","#d97706","#dc2626","#0891b2"];
  return cols[name.charCodeAt(0) % cols.length];
};

const Avatar = ({ name, size = 32 }) => (
  <div style={{ width: size, height: size, borderRadius: "50%", background: avatarColor(name), display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: size * 0.35, fontWeight: 700, flexShrink: 0 }}>
    {initials(name)}
  </div>
);

// ─── METRIC CARD ─────────────────────────────────────────────────────────────
const MetricCard = ({ label, value, sub, icon, accent, trend }) => (
  <div style={{ background: "#fff", borderRadius: 12, padding: "20px 24px", border: "1px solid #e5e7eb", display: "flex", flexDirection: "column", gap: 8 }}>
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
      <span style={{ fontSize: 13, color: "#6b7280", fontWeight: 500 }}>{label}</span>
      <div style={{ width: 36, height: 36, borderRadius: 8, background: accent + "18", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon name={icon} size={18} color={accent} />
      </div>
    </div>
    <div style={{ fontSize: 28, fontWeight: 700, color: "#111827", letterSpacing: "-0.5px" }}>{value}</div>
    {sub && <div style={{ fontSize: 12, color: "#9ca3af" }}>{sub}</div>}
    {trend && <div style={{ fontSize: 12, color: "#22c55e", fontWeight: 600 }}>↑ {trend}</div>}
  </div>
);

// ─── QUOTATION BUILDER ────────────────────────────────────────────────────────
const QuotationBuilder = ({ lead, onClose, accent }) => {
  const quoteNum = "QT-" + lead.id.replace("L-","") + "-" + new Date().getFullYear();
  const today = new Date().toLocaleDateString("en-GB", { day:"2-digit", month:"long", year:"numeric" });
  const validUntil = new Date(Date.now() + 7*24*60*60*1000).toLocaleDateString("en-GB", { day:"2-digit", month:"long", year:"numeric" });

  // Parse products from lead into line items
  const parseItems = () => {
    if (!lead.products) return [{ desc: "", qty: 1, unit: "AED", unitPrice: "", total: 0 }];
    return lead.products.split(",").map(p => {
      const m = p.trim().match(/^(.+?)\s+x(\d+)$/i);
      return m
        ? { desc: m[1].trim(), qty: parseInt(m[2]), unit: "AED", unitPrice: "", total: 0 }
        : { desc: p.trim(), qty: 1, unit: "AED", unitPrice: "", total: 0 };
    });
  };

  const [items, setItems] = React.useState(parseItems);
  const [vatPct, setVatPct] = React.useState(5);
  const [notes, setNotes] = React.useState("Thank you for your inquiry. We look forward to doing business with you.");
  const [payTerms, setPayTerms] = React.useState("50% advance, 50% on delivery");
  const [delivery, setDelivery] = React.useState("2–4 business days (UAE)");
  const [validity, setValidity] = React.useState("7 days");

  const updateItem = (i, field, val) => {
    setItems(prev => {
      const next = [...prev];
      next[i] = { ...next[i], [field]: val };
      const up = parseFloat(next[i].unitPrice) || 0;
      const q = parseFloat(next[i].qty) || 0;
      next[i].total = up * q;
      return next;
    });
  };

  const addItem = () => setItems(prev => [...prev, { desc: "", qty: 1, unit: "AED", unitPrice: "", total: 0 }]);
  const removeItem = (i) => setItems(prev => prev.filter((_, idx) => idx !== i));

  const subtotal = items.reduce((s, it) => s + (it.total || 0), 0);
  const vat = subtotal * (vatPct / 100);
  const grandTotal = subtotal + vat;
  const fmt = n => n.toLocaleString("en-AE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const openPrint = () => {
    const html = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Quotation ${quoteNum}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>

  body{font-family:'DM Sans',sans-serif;color:#1f2937;background:#fff;font-size:13px}
  @page{size:A4;margin:0}
  .page{width:210mm;min-height:297mm;padding:0;position:relative;background:#fff}
  .header{background:#111827;padding:32px 40px 24px;display:flex;justify-content:space-between;align-items:flex-start}
  .logo-row{display:flex;align-items:center;gap:12px}
  .logo-box{width:42px;height:42px;background:#f59e0b;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .logo-text{color:#fff;font-size:22px;font-weight:800;letter-spacing:-0.5px}
  .company-sub{color:#9ca3af;font-size:11px;margin-top:2px}
  .quote-meta{text-align:right;color:#d1d5db}
  .quote-num{font-size:20px;font-weight:700;color:#f59e0b}
  .gold-bar{height:4px;background:linear-gradient(90deg,#f59e0b,#d97706)}
  .body{padding:32px 40px}
  .bill-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:28px}
  .bill-box{background:#f9fafb;border-radius:8px;padding:16px}
  .bill-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#9ca3af;margin-bottom:8px}
  .bill-name{font-size:15px;font-weight:700;color:#111827;margin-bottom:4px}
  .bill-detail{font-size:12px;color:#6b7280;margin-top:2px}
  table{width:100%;border-collapse:collapse;margin-bottom:20px}
  thead tr{background:#111827;color:#fff}
  thead th{padding:10px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:0.04em}
  thead th:last-child,thead th:nth-last-child(2),thead th:nth-last-child(3){text-align:right}
  tbody tr{border-bottom:1px solid #f3f4f6}
  tbody tr:nth-child(even){background:#fafafa}
  tbody td{padding:10px 12px;font-size:12px;vertical-align:top}
  tbody td:last-child,tbody td:nth-last-child(2),tbody td:nth-last-child(3){text-align:right}
  .totals{margin-left:auto;width:260px}
  .total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #f3f4f6}
  .total-row.grand{font-size:16px;font-weight:700;color:#111827;border-bottom:none;padding-top:10px;border-top:2px solid #f59e0b;margin-top:4px}
  .terms{margin-top:24px;padding:16px;background:#f9fafb;border-radius:8px;border-left:3px solid #f59e0b}
  .terms-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280;margin-bottom:8px}
  .terms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .term-item{font-size:12px;color:#374151}
  .term-item span{font-weight:600;color:#111827}

  .footer{margin-top:32px;padding-top:16px;border-top:1px solid #e5e7eb;display:flex;justify-content:space-between;font-size:11px;color:#9ca3af}
  .sig-line{margin-top:40px;border-top:1px solid #d1d5db;padding-top:8px;font-size:11px;color:#9ca3af;width:180px}
  .authorized{display:flex;gap:40px;margin-top:24px}
  @media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="logo-row">
      <div class="logo-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="white"/><path d="M2 17l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M2 12l10 5 10-5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="logo-text">ChipSync</div>
        <div class="company-sub">Technology Solutions · Dubai, UAE</div>
        <div class="company-sub">sales@chipsync.ae · Authorized Dell · Lenovo · Apple Partner</div>
      </div>
    </div>
    <div class="quote-meta">
      <div class="quote-num">${quoteNum}</div>
      <div style="margin-top:6px;font-size:12px">Date: ${today}</div>

  <div class="body">

        <div class="bill-detail">${lead.name}</div>
        <div class="bill-detail">${lead.email}</div>
        <div class="bill-detail">${lead.phone}</div>
        <div class="bill-detail">${lead.location}</div>
        ${lead.trn ? `<div class="bill-detail" style="margin-top:6px">TRN: ${lead.trn}</div>` : ""}
      </div>
      <div class="bill-box">
        <div class="bill-label">Quote Details</div>
        <div class="bill-detail"><span style="font-weight:600">Quote No:</span> ${quoteNum}</div>
        <div class="bill-detail"><span style="font-weight:600">Ref Lead:</span> ${lead.id}</div>
        <div class="bill-detail"><span style="font-weight:600">Category:</span> ${lead.category}</div>
        <div class="bill-detail"><span style="font-weight:600">Payment:</span> ${payTerms}</div>
        <div class="bill-detail"><span style="font-weight:600">Delivery:</span> ${delivery}</div>
        <div class="bill-detail"><span style="font-weight:600">Valid For:</span> ${validity}</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th>Description</th>
          <th style="width:60px">Qty</th>
          <th style="width:110px">Unit Price (AED)</th>
          <th style="width:110px">Total (AED)</th>
        </tr>
      </thead>
      <tbody>
        ${items.map((it, i) => `
        <tr>
          <td style="color:#9ca3af">${i+1}</td>
          <td style="font-weight:500">${it.desc || "—"}</td>
          <td>${it.qty}</td>
          <td>${it.unitPrice ? parseFloat(it.unitPrice).toLocaleString("en-AE",{minimumFractionDigits:2}) : "—"}</td>
          <td style="font-weight:600">${it.total ? it.total.toLocaleString("en-AE",{minimumFractionDigits:2}) : "—"}</td>
        </tr>`).join("")}
      </tbody>
    </table>

    <div class="totals">
      <div class="total-row"><span>Subtotal</span><span>AED ${fmt(subtotal)}</span></div>
      <div class="total-row"><span>VAT (${vatPct}%)</span><span>AED ${fmt(vat)}</span></div>
      <div class="total-row grand"><span>Grand Total</span><span style="color:#d97706">AED ${fmt(grandTotal)}</span></div>
    </div>

    <div class="terms">
      <div class="terms-title">Terms & Conditions</div>
      <div class="terms-grid">
        <div class="term-item"><span>Payment: </span>${payTerms}</div>
        <div class="term-item"><span>Delivery: </span>${delivery}</div>
        <div class="term-item"><span>Validity: </span>${validity}</div>
        <div class="term-item"><span>Warranty: </span>As per manufacturer</div>
      </div>
    </div>

    <div class="notes">${notes}</div>

    <div class="authorized">
      <div><div class="sig-line">Authorized Signature</div></div>
      <div><div class="sig-line">Company Stamp</div></div>

    <div class="footer">

      <span>Authorized Dell · Lenovo · Apple Partner</span>
    </div>
  </div>
</div>
</body>
</html>`;
    const w = window.open("", "_blank", "width=900,height=700");
    w.document.write(html);
    w.document.close();
    setTimeout(() => w.print(), 600);
  };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center" }}>

              <button onClick={addItem} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 10px", background: accent + "18", border: `1px solid ${accent}44`, borderRadius: 6, color: accent, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>

              </button>
            </div>

            {/* Table header */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 70px 130px 110px 28px", gap: 6, padding: "6px 8px", background: "#f9fafb", borderRadius: "6px 6px 0 0", border: "1px solid #e5e7eb", borderBottom: "none" }}>
              {["Description", "Qty", "Unit Price (AED)", "Total (AED)", ""].map(h => (
                <div key={h} style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: "0.04em", textAlign: h === "Total (AED)" || h === "Unit Price (AED)" ? "right" : "left" }}>{h}</div>
              ))}
            </div>

            {/* Rows */}
            <div style={{ border: "1px solid #e5e7eb", borderRadius: "0 0 8px 8px", overflow: "hidden" }}>
              {items.map((it, i) => (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 70px 130px 110px 28px", gap: 6, padding: "7px 8px", borderBottom: i < items.length - 1 ? "1px solid #f3f4f6" : "none", alignItems: "center", background: i % 2 === 0 ? "#fff" : "#fafafa" }}>
                  <input value={it.desc} onChange={e => updateItem(i,"desc",e.target.value)} placeholder="Product description" style={{ padding: "6px 8px", border: "1px solid #e5e7eb", borderRadius: 6, fontSize: 12, width: "100%", outline: "none" }} />
                  <input type="number" value={it.qty} onChange={e => updateItem(i,"qty",e.target.value)} min={1} style={{ padding: "6px 8px", border: "1px solid #e5e7eb", borderRadius: 6, fontSize: 12, width: "100%", textAlign: "center", outline: "none" }} />
                  <input type="number" value={it.unitPrice} onChange={e => updateItem(i,"unitPrice",e.target.value)} placeholder="0.00" style={{ padding: "6px 8px", border: `1.5px solid ${it.unitPrice ? accent : "#e5e7eb"}`, borderRadius: 6, fontSize: 12, width: "100%", textAlign: "right", outline: "none" }} />
                  <div style={{ textAlign: "right", fontSize: 13, fontWeight: 700, color: it.total ? "#111827" : "#d1d5db" }}>

// ─── LEADS PAGE ───────────────────────────────────────────────────────────────
const LeadsPage = ({ accent }) => {
  const [leads, setLeads] = React.useState(LEADS);
  const [search, setSearch] = React.useState("");
  const [filterStatus, setFilterStatus] = React.useState("All");
  const [filterPriority, setFilterPriority] = React.useState("All");
  const [selected, setSelected] = React.useState(null);

  const filtered = leads.filter(l => {
    const matchSearch = !search || l.name.toLowerCase().includes(search.toLowerCase()) || l.company.toLowerCase().includes(search.toLowerCase()) || l.id.toLowerCase().includes(search.toLowerCase()) || l.category.toLowerCase().includes(search.toLowerCase());
    const matchStatus = filterStatus === "All" || l.status === filterStatus;
    const matchPriority = filterPriority === "All" || l.priority === filterPriority;
    return matchSearch && matchStatus && matchPriority;
  });

  const handleStatusChange = (id, newStatus) => {
    setLeads(prev => prev.map(l => l.id === id ? { ...l, status: newStatus } : l));
  };

  const statusCounts = Object.keys(STATUS_CONFIG).reduce((acc, s) => {
    acc[s] = leads.filter(l => l.status === s).length;
    return acc;
  }, {});

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 0, height: "100%" }}>
      {/* Page header */}
      <div style={{ padding: "24px 28px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <h1 style={{ fontSize: 22, fontWeight: 700, color: "#111827" }}>Leads & Inquiries</h1>
          <p style={{ fontSize: 13, color: "#6b7280", marginTop: 2 }}>{leads.length} total leads</p>
        </div>
        <button style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: accent, border: "none", borderRadius: 8, color: "#fff", fontWeight: 600, fontSize: 13, cursor: "pointer" }}>
          <Icon name="plus" size={14} color="#fff" /> Add Lead
        </button>
      </div>

      {/* Status tabs */}
      <div style={{ padding: "16px 28px 0", display: "flex", gap: 6, flexWrap: "wrap" }}>
        {["All", ...Object.keys(STATUS_CONFIG)].map(s => (
          <button key={s} onClick={() => setFilterStatus(s)} style={{ padding: "5px 14px", borderRadius: 20, border: `1.5px solid ${filterStatus === s ? accent : "#e5e7eb"}`, background: filterStatus === s ? accent + "18" : "#fff", color: filterStatus === s ? accent : "#6b7280", cursor: "pointer", fontSize: 12, fontWeight: 600, transition: "all 0.15s" }}>
            {s}{s !== "All" && statusCounts[s] > 0 && <span style={{ marginLeft: 5, background: filterStatus === s ? accent : "#e5e7eb", color: filterStatus === s ? "#fff" : "#374151", borderRadius: 10, padding: "0 6px", fontSize: 10 }}>{statusCounts[s]}</span>}
          </button>
        ))}
      </div>

      {/* Search + filter */}
      <div style={{ padding: "12px 28px", display: "flex", gap: 10, alignItems: "center" }}>
        <div style={{ flex: 1, position: "relative" }}>
          <span style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }}>
            <Icon name="search" size={15} color="#9ca3af" />
          </span>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search leads, companies, IDs…" style={{ width: "100%", padding: "9px 12px 9px 35px", border: "1px solid #e5e7eb", borderRadius: 8, fontSize: 13, outline: "none", background: "#fff" }} />
        </div>
        <select value={filterPriority} onChange={e => setFilterPriority(e.target.value)} style={{ padding: "9px 12px", border: "1px solid #e5e7eb", borderRadius: 8, fontSize: 13, background: "#fff", cursor: "pointer" }}>

          <option>High</option><option>Medium</option><option>Low</option>
        </select>
      </div>

      {/* Table */}
      <div style={{ flex: 1, overflow: "auto", padding: "0 28px 28px" }}>

            <thead>
              <tr style={{ background: "#f9fafb", borderBottom: "1px solid #e5e7eb" }}>
                {["ID", "Contact", "Category", "Budget", "Status", "Priority", "Assignee", "Date", ""].map(h => (
                  <th key={h} style={{ padding: "11px 16px", textAlign: "left", fontSize: 11, fontWeight: 600, color: "#6b7280", textTransform: "uppercase", letterSpacing: "0.05em", whiteSpace: "nowrap" }}>{h}</th>
                ))}

            <tbody>
              {filtered.map((lead, i) => (
                <tr key={lead.id} onClick={() => setSelected(lead)} style={{ borderBottom: "1px solid #f3f4f6", cursor: "pointer", transition: "background 0.1s", background: i % 2 === 0 ? "#fff" : "#fafafa" }}
                  onMouseEnter={e => e.currentTarget.style.background = "#f0f9ff"}
                  onMouseLeave={e => e.currentTarget.style.background = i % 2 === 0 ? "#fff" : "#fafafa"}>
                  <td style={{ padding: "12px 16px", fontSize: 12, fontWeight: 600, color: accent, fontFamily: "'DM Mono', monospace" }}>{lead.id}</td>

                  <td style={{ padding: "12px 16px" }}><PriorityBadge priority={lead.priority} /></td>

                  <td style={{ padding: "12px 16px", fontSize: 12, color: "#9ca3af", whiteSpace: "nowrap" }}>{lead.date}</td>
                  <td style={{ padding: "12px 16px" }}>
                    <button onClick={e => { e.stopPropagation(); setSelected(lead); }} style={{ padding: "5px 10px", border: "1px solid #e5e7eb", borderRadius: 6, background: "#fff", cursor: "pointer", fontSize: 11, fontWeight: 600, color: "#374151" }}>View</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && (
            <div style={{ padding: 40, textAlign: "center", color: "#9ca3af", fontSize: 14 }}>No leads match your filters.</div>
          )}
        </div>
      </div>

      {selected && <LeadDrawer lead={selected} onClose={() => setSelected(null)} onStatusChange={handleStatusChange} accent={accent} />}
    </div>
  );
};

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const accent = tweaks.accentColor;
  const [page, setPage] = React.useState("dashboard");
  const [sidebarCollapsed, setSidebarCollapsed] = React.useState(false);
  const [currentUser, setCurrentUser] = React.useState(() => {
    try { return JSON.parse(sessionStorage.getItem("chipsync_user")) || null; } catch { return null; }
  });

  const handleLogin = (account) => {
    sessionStorage.setItem("chipsync_user", JSON.stringify(account));
    setCurrentUser(account);
  };

  const handleLogout = () => {
    sessionStorage.removeItem("chipsync_user");
    setCurrentUser(null);
  };

  if (!currentUser) return <LoginScreen onLogin={handleLogin} />;

  const NAV = [
    { id: "dashboard", label: "Overview", icon: "dashboard" },
    { id: "leads", label: "Leads", icon: "leads" },
    { id: "customers", label: "Customers", icon: "customers" },
    { id: "analytics", label: "Analytics", icon: "analytics" },
    { id: "team", label: "Team", icon: "team" },
  ];

  const renderPage = () => {
    if (page === "dashboard") return <DashboardHome accent={accent} setPage={setPage} currentUser={currentUser} />;
    if (page === "leads") return <LeadsPage accent={accent} />;
    if (page === "customers") return <CustomersPage accent={accent} />;

              <div style={{ fontWeight: 700, fontSize: 16, color: "#111827" }}>{t.name}</div>
              <div style={{ fontSize: 12, color: "#9ca3af", marginBottom: 16 }}>{t.role}</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {[["Leads", t.leads], ["Closed", t.closed], ["Value", t.value], ["Rate", t.rate]].map(([k,v]) => (

            <button style={{ position: "relative", width: 36, height: 36, borderRadius: 8, border: "1px solid #e5e7eb", background: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="bell" size={16} color="#6b7280" />
              <span style={{ position: "absolute", top: 6, right: 7, width: 7, height: 7, borderRadius: "50%", background: "#ef4444", border: "1.5px solid #fff" }}></span>
            </button>
            <div style={{ display: "flex", gap: 8, alignItems: "center", padding: "4px 8px", border: "1px solid #e5e7eb", borderRadius: 8 }}>
              <Avatar name={currentUser.name} size={26} />
              <div style={{ display: "flex", flexDirection: "column" }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: "#374151", lineHeight: 1.2 }}>{currentUser.name}</span>
                <span style={{ fontSize: 10, color: "#9ca3af", lineHeight: 1.2 }}>{currentUser.roleLabel}</span>
              </div>
            </div>
            <button onClick={handleLogout} title="Sign out" style={{ width: 36, height: 36, borderRadius: 8, border: "1px solid #e5e7eb", background: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="logout" size={15} color="#6b7280" />
            </button>
          </div>
        </div>

        {/* Page content */}
        <div style={{ flex: 1, overflow: "hidden" }}>
          {renderPage()}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Appearance" />
        <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => setTweak("accentColor", v)} />
        <TweakToggle label="Dark Sidebar" value={tweaks.sidebarDark} onChange={v => setTweak("sidebarDark", v)} />
        <TweakToggle label="Compact Mode" value={tweaks.compactMode} onChange={v => setTweak("compactMode", v)} />
        <TweakToggle label="Show Avatars" value={tweaks.showAvatars} onChange={v => setTweak("showAvatars", v)} />
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
